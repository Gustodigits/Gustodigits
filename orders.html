<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f4f9fd">
<meta name="description" content="View and manage your Gustodigits virtual number orders.">
<title>Orders - Gustodigits</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--blue:#2388e8;--blue-dark:#176fc3;--blue-soft:#eaf5ff;--green:#20b26b;--green-soft:#e8f9f1;--red:#e94b55;--red-soft:#fff0f1;--yellow:#d89518;--yellow-soft:#fff7e5;--text:#172334;--muted:#718096;--border:#e4edf5;--background:#f4f9fd;--white:#fff;--shadow:0 8px 25px rgba(32,111,175,.07)}
html,body{width:100%;min-height:100%}body{background:var(--background);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button{font:inherit;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:inherit;text-decoration:none}.app{width:100%;max-width:620px;min-height:100vh;margin:auto;padding-bottom:30px}.header{height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(244,249,253,.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}.header-button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#fff;color:var(--text);border:1px solid var(--border);font-size:20px}.refresh-button{margin-left:auto}.brand-name{font-size:18px;font-weight:850;letter-spacing:-.3px}.brand-sub{margin-top:2px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.7px;text-transform:uppercase}main{padding:18px 16px 90px}.page-heading h1{font-size:24px;font-weight:850;letter-spacing:-.6px}.page-heading p{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.summary-card,.orders-card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.summary-card{padding:13px}.summary-label{color:var(--muted);font-size:10px;font-weight:700}.summary-value{margin-top:5px;font-size:21px;font-weight:850}.orders-card{padding:14px}.orders-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.orders-title{font-size:15px;font-weight:850}.orders-count{color:var(--blue-dark);background:var(--blue-soft);border:1px solid #d8ecfb;padding:5px 8px;border-radius:9px;font-size:9px;font-weight:800}.order-list{display:flex;flex-direction:column;gap:10px}.order{background:#fff;border:1px solid #e1eaf1;border-radius:16px;padding:13px}.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.order-service{font-size:14px;font-weight:850;word-break:break-word}.order-country{margin-top:3px;color:var(--muted);font-size:10px}.status{display:inline-flex;align-items:center;padding:5px 8px;border-radius:9px;font-size:9px;font-weight:850;white-space:nowrap}.status-pending{color:#a66a00;background:var(--yellow-soft);border:1px solid #f2ddb0}.status-received{color:#148050;background:var(--green-soft);border:1px solid #cdeedc}.status-cancelled{color:#c5303a;background:var(--red-soft);border:1px solid #f5ccd0}.number-box,.code-box,.sms-box{margin-top:10px;padding:11px;border-radius:12px;background:#f7fbfe;border:1px solid #e5eef5}.box-label,.meta-label{color:var(--muted);font-size:9px;font-weight:750}.number{margin-top:4px;color:var(--text);font-size:18px;font-weight:850;word-break:break-all}.copy-button{margin-top:8px;min-height:31px;padding:0 10px;border-radius:9px;background:var(--blue-soft);color:#1774c6;border:1px solid #d5eafb;font-size:10px;font-weight:850}.code{margin-top:4px;color:var(--blue-dark);font-size:21px;font-weight:900;letter-spacing:1px;word-break:break-all}.sms{margin-top:5px;color:#43515e;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.order-meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #edf2f6}.meta-value{margin-top:3px;color:var(--text);font-size:10px;font-weight:800;word-break:break-word}.actions{display:flex;gap:8px;margin-top:11px}.action-button{flex:1;min-height:38px;border-radius:10px;font-size:11px;font-weight:850}.get-code{background:var(--blue);color:#fff;box-shadow:0 6px 15px rgba(35,136,232,.13)}.cancel-order{background:var(--red-soft);color:#c5303a;border:1px solid #f3ccd0}.loading,.empty,.error{text-align:center;padding:35px 12px;color:var(--muted);font-size:11px;line-height:1.5}.error{color:var(--red)}.spinner{width:27px;height:27px;margin:0 auto 9px;border:3px solid #dcecf8;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.bottom-links{display:flex;gap:9px;margin-top:15px}.bottom-links a{flex:1;text-align:center;padding:13px;border-radius:12px;background:#fff;border:1px solid var(--border);color:#2876aa;font-size:11px;font-weight:850}.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(8,22,35,.55);z-index:100}.modal-overlay.show{display:flex}.modal{width:min(390px,100%);background:#fff;border-radius:20px;padding:18px}.modal h2{margin-top:10px;font-size:17px;font-weight:850}.modal p{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.5}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{flex:1;min-height:42px;border-radius:11px;font-size:11px;font-weight:850}.modal-no{background:#f2f6f9;color:#50606d}.modal-yes{background:var(--red);color:#fff}.toast{position:fixed;left:50%;bottom:24px;width:min(390px,calc(100vw - 28px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#172334;color:#fff;padding:12px 14px;border-radius:13px;font-size:11px;font-weight:750;text-align:center;z-index:200;transition:.2s ease}.toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="header-button" type="button" onclick="location.href='dashboard.html'" aria-label="Back to dashboard">←</button><div><div class="brand-name">Gustodigits</div><div class="brand-sub">Virtual Numbers</div></div><button class="header-button refresh-button" id="refreshButton" type="button" aria-label="Refresh orders">↻</button></header>
<main><div class="page-heading"><h1>My Orders</h1><p>View your virtual numbers, verification codes and order status.</p></div>
<div class="summary"><div class="summary-card"><div class="summary-label">Total Orders</div><div class="summary-value" id="totalOrders">0</div></div><div class="summary-card"><div class="summary-label">Received</div><div class="summary-value" id="receivedOrders">0</div></div></div>
<section class="orders-card"><div class="orders-header"><div class="orders-title">Recent Orders</div><div class="orders-count" id="ordersCount">0 orders</div></div><div class="order-list" id="orderList"><div class="loading"><div class="spinner"></div>Loading orders...</div></div></section>
<div class="bottom-links"><a href="dashboard.html">← Dashboard</a><a href="transactions.html">Transactions</a></div></main></div>
<div class="modal-overlay" id="cancelModal"><div class="modal"><h2>Cancel this number?</h2><p>The number will be cancelled and any eligible wallet refund will be processed.</p><div class="modal-actions"><button type="button" class="modal-no" id="cancelNo">No, Keep It</button><button type="button" class="modal-yes" id="cancelYes">Yes, Cancel</button></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SUPABASE_URL='https://gvuaxtsdpmrragkkjowv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_oDAsADaZzLDiFX0cXogUyw_tTQYCa2k';
const TEXT_VERIFIED_FUNCTION_URL=`${SUPABASE_URL}/functions/v1/text-verified-api`;
const VIRTUAL_SMS_FUNCTION_URL=`${SUPABASE_URL}/functions/v1/virtual-sms-api`;
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentSession=null,currentOrders=[],pendingCancelOrder=null;
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function formatMoney(value){return Number(value||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});}
function formatDate(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'});}
function showToast(message){const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2800);}
function normalizeStatus(value){return String(value||'').toLowerCase().trim().replace(/[\s-]+/g,'_');}
function isRejectedStatus(status){return ['failed','failure','unsuccessful','not_successful','expired','rejected','refunded','refund_pending','purchase_failed','reservation_failed','cancelled_before_purchase','canceled_before_purchase','error'].includes(normalizeStatus(status));}
function normalizeOrder(order){
 if(!order||typeof order!=='object')return null;
 const rawStatus=normalizeStatus(order.status||order.order_status||order.orderStatus||'pending');
 // Keep failed/cancelled/refunded history visible when a real number was issued.
 // The order card below reflects its status instead of silently hiding it.
 const number=String(order.phone_number??order.phoneNumber??order.phone??order.number??'').trim();
 const providerActivation=String(order.provider_activation_id??order.providerActivationId??order.activation_id??order.activationId??order.numpool_order_id??order.numpoolOrderId??'').trim().replace(/^smsbower:/i,'');
 // A UUID row ID or pending:<request-id> is not a provider activation ID.
 if(!number||number==='—'||/^(number purchased|pending|unknown)$/i.test(number))return null;
 if((!providerActivation||providerActivation.startsWith('pending:'))&&!isRejectedStatus(rawStatus)&&!rawStatus.includes('cancel'))return null;
 let status='pending';
 if(rawStatus.includes('cancel'))status='cancelled';
 else if(rawStatus.includes('receive')||rawStatus.includes('success')||rawStatus.includes('complete')||rawStatus==='ok'||rawStatus==='verified'||rawStatus==='delivered')status='received';
 const date=order.created_at||order.createdAt||order.purchased_at||order.purchasedAt||order.updated_at||order.updatedAt||'';
 const timestamp=new Date(date||0).getTime()||0;
 return {raw:order,id:order.id||order.order_id||order.orderId||providerActivation,activationId:providerActivation,provider:String(order.provider||order.provider_name||''),country:order.country_name||order.countryName||order.country||'Unknown country',service:order.service_name||order.serviceName||order.service||'Virtual Number',number,code:order.otp_code||order.otpCode||order.sms_code||order.smsCode||order.code||'',sms:order.full_sms||order.fullSms||order.sms_text||order.smsText||order.text||order.message||'',price:order.customer_price_ngn??order.customerPriceNgn??order.price??order.amount??0,date,timestamp,status};
}
async function callProvider(action,payload={}){
 if(!currentSession?.access_token)throw new Error('Your session has expired. Please log in again.');
 if(action==='orders'){
  const userId=currentSession?.user?.id;
  if(!userId)throw new Error('Your session has expired. Please log in again.');
  const {data,error}=await supabaseClient.from('virtual_number_orders').select('*').eq('user_id',userId).order('created_at',{ascending:false}).limit(100);
  if(error)throw new Error(error.message||'Your orders could not be loaded.');
  const visible=(data||[]).filter(order=>{
   const provider=String(order.provider||order.provider_id||order.server_id||'').toLowerCase().trim();
   // Older SMSBower purchases stored the selected numeric server ID (e.g. 11 or 362)
   // in provider/provider_id. Treat those as SMSBower orders rather than hiding them.
   const supportedProvider=provider==='textverified'||provider==='text-verified-api'||provider==='virtualsms'||provider==='virtual-sms-api'||provider==='sms-bower'||provider.startsWith('smsbower')||/^\d+$/.test(provider);
   return supportedProvider && Boolean(normalizeOrder(order));
  });
  return {ok:true,orders:visible};
 }
 const provider=String(payload.provider||'virtual-sms-api').toLowerCase();
 const functionUrl=(provider==='text-verified-api'||provider==='textverified')?TEXT_VERIFIED_FUNCTION_URL:(provider==='sms-bower'||provider.startsWith('smsbower')? `${SUPABASE_URL}/functions/v1/smsbower-api`:VIRTUAL_SMS_FUNCTION_URL);
 const requestPayload={...payload};
 delete requestPayload.provider;
 const isSmsBower=provider==='smsbower'||provider==='smsbower-api'||provider==='sms-bower'||provider.startsWith('smsbower_');
 const providerAction=isSmsBower&&action==='status'?'check':action;
 const response=await fetch(functionUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentSession.access_token}`,'apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:providerAction,...requestPayload})});
 let data;try{data=await response.json();}catch{throw new Error('Invalid server response.');}
 if(!response.ok||data?.ok===false)throw new Error(String(data?.message||data?.error||data?.msg||'Request failed.'));
 return data;
}
function extractOrders(result){if(Array.isArray(result?.orders))return result.orders;if(Array.isArray(result?.data))return result.data;if(Array.isArray(result))return result;return [];}
async function loadOrders(){const container=$('orderList');container.innerHTML='<div class="loading"><div class="spinner"></div>Loading orders...</div>';try{const result=await callProvider('orders');currentOrders=extractOrders(result).map(normalizeOrder).filter(Boolean).sort((a,b)=>b.timestamp-a.timestamp);renderOrders();}catch(error){console.error('Orders loading error:',error);container.innerHTML=`<div class="error">❌ Unable to load orders.<br><br>${escapeHtml(error?.message||'Request failed.')}</div>`;$('totalOrders').textContent='0';$('receivedOrders').textContent='0';$('ordersCount').textContent='0 orders';}}
function renderOrders(){$('totalOrders').textContent=String(currentOrders.length);$('receivedOrders').textContent=String(currentOrders.filter(o=>o.status==='received').length);$('ordersCount').textContent=`${currentOrders.length} ${currentOrders.length===1?'order':'orders'}`;if(!currentOrders.length){$('orderList').innerHTML='<div class="empty">No confirmed virtual number purchases to show yet.</div>';return;}$('orderList').innerHTML=currentOrders.map(createOrderCard).join('');}
function createNumberBox(order){return `<div class="number-box"><div class="box-label">Phone Number</div><div class="number">${escapeHtml(order.number)}</div><button type="button" class="copy-button" data-copy="${escapeHtml(order.number)}">📋 Copy Number</button></div>`;}
function createOrderCard(order){const rawStatus=normalizeStatus(order.raw?.status||order.status);const badge=order.status==='received'?'<span class="status status-received">✅ Successful</span>':order.status==='cancelled'?'<span class="status status-cancelled">❌ Cancelled</span>':isRejectedStatus(rawStatus)?'<span class="status status-cancelled">⚠️ Unsuccessful</span>':'<span class="status status-pending">⏳ Pending</span>';let codeSection=order.code?`<div class="code-box"><div class="box-label">OTP / Verification Code</div><div class="code">${escapeHtml(order.code)}</div><button type="button" class="copy-button" data-copy="${escapeHtml(order.code)}">📋 Copy Code</button></div>`:order.status==='pending'&&!isRejectedStatus(rawStatus)?'<div class="code-box"><div class="box-label">OTP / Verification Code</div><div class="code">Waiting...</div></div>':'';const smsSection=order.sms&&order.status==='received'?`<div class="sms-box"><div class="box-label">SMS Message</div><div class="sms">${escapeHtml(order.sms)}</div></div>`:'';const actions=(order.status==='pending'&&!isRejectedStatus(rawStatus))?`<div class="actions"><button type="button" class="action-button get-code" data-get-code="${escapeHtml(order.activationId)}">Get Code</button><button type="button" class="action-button cancel-order" data-cancel="${escapeHtml(order.activationId)}">Cancel</button></div>`:'';return `<article class="order"><div class="order-top"><div><div class="order-service">${escapeHtml(order.service)}</div><div class="order-country">${escapeHtml(order.country)}</div></div>${badge}</div>${createNumberBox(order)}${codeSection}${smsSection}<div class="order-meta"><div><div class="meta-label">Price</div><div class="meta-value">₦${formatMoney(order.price)}</div></div><div><div class="meta-label">${order.status==='cancelled'?'Cancelled':'Purchased'}</div><div class="meta-value">${escapeHtml(formatDate(order.date))}</div></div></div>${actions}</article>`;}
function findOrder(activationId){return currentOrders.find(o=>String(o.activationId)===String(activationId))||null;}
function providerFunctionName(order){const p=String(order?.provider||order?.raw?.provider||order?.raw?.provider_id||order?.raw?.server_id||'').toLowerCase().trim();if(p==='textverified'||p==='text-verified-api')return 'text-verified-api';if(p==='sms-bower'||p.startsWith('smsbower')||/^\d+$/.test(p))return 'smsbower-api';if(p==='virtualsms'||p==='virtual-sms-api')return 'virtual-sms-api';return undefined;}
$('orderList').addEventListener('click',async event=>{const copy=event.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy||'');const old=copy.textContent;copy.textContent='✅ Copied';setTimeout(()=>copy.textContent=old,1400);}catch{showToast('Could not copy. Please copy it manually.');}return;}const get=event.target.closest('[data-get-code]');if(get){const order=findOrder(get.dataset.getCode);if(order)await getCode(order,get);return;}const cancel=event.target.closest('[data-cancel]');if(cancel){const order=findOrder(cancel.dataset.cancel);if(order){pendingCancelOrder=order;$('cancelModal').classList.add('show');}}});
async function getCode(order,button){const activationId=order.activationId;if(!activationId||activationId.startsWith('pending:')){showToast('A confirmed provider activation ID was not found.');return;}button.disabled=true;button.textContent='Checking...';try{await callProvider('status',{orderId:order.id,order_id:order.id,activation_id:activationId,activationId,provider:providerFunctionName(order)});await loadOrders();const latest=findOrder(activationId);showToast(latest?.code?'Verification code received.':'Status checked. If the SMS has not arrived, try again shortly.');}catch(error){showToast(error?.message||'Unable to check code right now.');}finally{const current=findOrder(activationId);if(current){const b=[...$('orderList').querySelectorAll('[data-get-code]')].find(x=>x.dataset.getCode===activationId);if(b){b.disabled=false;b.textContent='Get Code';}}}}
$('cancelNo').addEventListener('click',()=>{$('cancelModal').classList.remove('show');pendingCancelOrder=null;});$('cancelModal').addEventListener('click',event=>{if(event.target===$('cancelModal')){$('cancelModal').classList.remove('show');pendingCancelOrder=null;}});$('cancelYes').addEventListener('click',async()=>{const order=pendingCancelOrder;$('cancelModal').classList.remove('show');pendingCancelOrder=null;if(!order)return;await cancelOrder(order);});
async function cancelOrder(order){const activationId=order.activationId;if(!activationId||activationId.startsWith('pending:')){showToast('A confirmed provider activation ID was not found.');return;}const button=[...$('orderList').querySelectorAll('[data-cancel]')].find(x=>x.dataset.cancel===activationId);if(button){button.disabled=true;button.textContent='Cancelling...';}try{await callProvider('cancel',{orderId:order.id,order_id:order.id,activation_id:activationId,activationId,provider:providerFunctionName(order)});showToast('Cancellation request submitted.');await loadOrders();}catch(error){showToast(error?.message||'Cancellation unavailable. Please try again.');if(button){button.disabled=false;button.textContent='Cancel';}}}
let orderPollTimer=null,orderPollBusy=false;
async function pollPendingOrderCodes(){
 if(orderPollBusy||!currentSession?.access_token||document.visibilityState!=='visible')return;
 orderPollBusy=true;
 try{
  const pending=currentOrders.filter(o=>o.status==='pending'&&!isRejectedStatus(normalizeStatus(o.raw?.status))&&o.activationId&&!o.activationId.startsWith('pending:')).slice(0,5);
  let updated=false;
  for(const order of pending){
   try{
    const result=await callProvider('status',{order_id:order.id,orderId:order.id,activation_id:order.activationId,activationId:order.activationId,provider:providerFunctionName(order)});
    if(result?.code||result?.otp_code||result?.sms_code||result?.order?.otp_code||result?.order?.sms_code)updated=true;
   }catch(error){console.debug('Order code auto-check:',error?.message||error);}
  }
  if(updated)await loadOrders();
 }finally{orderPollBusy=false;}
}
function startOrderCodePolling(){
 if(orderPollTimer)return;
 orderPollTimer=setInterval(()=>{void pollPendingOrderCodes();},12000);
 void pollPendingOrderCodes();
}
$('refreshButton').addEventListener('click',async()=>{const button=$('refreshButton');button.disabled=true;button.textContent='…';try{await loadOrders();}finally{button.disabled=false;button.textContent='↻';}});
async function initialize(){try{const {data,error}=await supabaseClient.auth.getSession();if(error||!data?.session){location.replace('login.html');return;}currentSession=data.session;supabaseClient.auth.onAuthStateChange((event,session)=>{currentSession=session;if(event==='SIGNED_OUT')location.replace('login.html');});await loadOrders();startOrderCodePolling();}catch(error){console.error('Orders initialization error:',error);$('orderList').innerHTML=`<div class="error">❌ Unable to open orders.<br><br>${escapeHtml(error?.message||'Request failed.')}</div>`;}}
initialize();
</script>
</body>
</html>
