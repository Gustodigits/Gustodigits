<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet - Gustodigits</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f9ff;
  color:#172033;
  min-height:100vh;
}

.header{
  background:#ffffff;
  border-bottom:1px solid #e3edf8;
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;
  top:0;
  z-index:10;
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:#eef6ff;
  color:#1976d2;
  font-size:22px;
  cursor:pointer;
}

.header-title{
  font-size:20px;
  font-weight:700;
}

.container{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:22px 16px 40px;
}

.balance-card{
  background:linear-gradient(135deg,#1976d2,#42a5f5);
  color:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 10px 25px rgba(25,118,210,.18);
  margin-bottom:22px;
}

.balance-label{
  font-size:14px;
  opacity:.9;
  margin-bottom:8px;
}

.balance{
  font-size:32px;
  font-weight:800;
}

.card{
  background:#ffffff;
  border:1px solid #e4edf7;
  border-radius:20px;
  padding:20px;
  box-shadow:0 6px 20px rgba(20,70,120,.05);
}

.card-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:16px;
}

.amount-input{
  width:100%;
  height:52px;
  border:1px solid #d7e5f3;
  border-radius:13px;
  padding:0 15px;
  font-size:16px;
  outline:none;
  background:#fbfdff;
}

.amount-input:focus{
  border-color:#42a5f5;
  box-shadow:0 0 0 3px rgba(66,165,245,.12);
}

.quick-title{
  margin-top:20px;
  margin-bottom:12px;
  font-size:14px;
  font-weight:700;
  color:#526173;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.quick-btn{
  border:1px solid #d8e8f8;
  background:#f5faff;
  color:#1976d2;
  min-height:42px;
  border-radius:11px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.quick-btn:hover{
  background:#eaf5ff;
}

.quick-btn.active{
  background:#1976d2;
  color:white;
  border-color:#1976d2;
}

.pay-btn{
  width:100%;
  height:54px;
  margin-top:20px;
  border:none;
  border-radius:14px;
  background:#1976d2;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(25,118,210,.2);
}

.pay-btn:hover{
  background:#1565c0;
}

.pay-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  margin-top:15px;
  padding:12px 14px;
  border-radius:11px;
  display:none;
  font-size:14px;
  line-height:1.5;
}

.status.success{
  display:block;
  background:#eaf8ef;
  color:#19733a;
}

.status.error{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.status.info{
  display:block;
  background:#edf6ff;
  color:#1565c0;
}

.note{
  margin-top:16px;
  text-align:center;
  font-size:12px;
  color:#7a8797;
  line-height:1.5;
}

@media(max-width:400px){
  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header class="header">
  <button class="back-btn" onclick="goBack()">‹</button>
  <div class="header-title">Fund Wallet</div>
</header>

<main class="container">

  <section class="balance-card">
    <div class="balance-label">Available Balance</div>
    <div class="balance" id="balance">₦0.00</div>
  </section>

  <section class="card">

    <div class="card-title">Add Money</div>

    <input
      type="number"
      id="amount"
      class="amount-input"
      placeholder="Enter amount"
      min="100"
      step="1"
    >

    <div class="quick-title">Quick Select</div>

    <div class="quick-grid">

      <button class="quick-btn" onclick="selectAmount(100,this)">
        ₦100
      </button>

      <button class="quick-btn" onclick="selectAmount(200,this)">
        ₦200
      </button>

      <button class="quick-btn" onclick="selectAmount(500,this)">
        ₦500
      </button>

      <button class="quick-btn" onclick="selectAmount(1000,this)">
        ₦1,000
      </button>

      <button class="quick-btn" onclick="selectAmount(2000,this)">
        ₦2,000
      </button>

      <button class="quick-btn" onclick="selectAmount(5000,this)">
        ₦5,000
      </button>

      <button class="quick-btn" onclick="selectAmount(10000,this)">
        ₦10,000
      </button>

      <button class="quick-btn" onclick="selectAmount(20000,this)">
        ₦20,000
      </button>

    </div>

    <button id="payBtn" class="pay-btn" onclick="fundWallet()">
      Fund Wallet
    </button>

    <div id="status" class="status"></div>

    <div class="note">
      Your wallet will be credited automatically after successful payment.
    </div>

  </section>

</main>

<script>
/* =========================================================
   GUSTODIGITS SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://gvuaxtsdpmrragkkjowv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oDAsADaZzLDiFX0cXogUyw_tTQYCa2k";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================================================
   EXISTING PAYSTACK PUBLIC KEY
   ========================================================= */

const PAYSTACK_PUBLIC_KEY =
  "pk_live_404fd9834a0f367328c2fb55a2256e406ed6b43f";


let currentUser = null;
let oldBalance = 0;


/* =========================================================
   BACK BUTTON
   ========================================================= */

function goBack(){
  window.location.href = "dashboard.html";
}


/* =========================================================
   FORMAT MONEY
   ========================================================= */

function formatMoney(amount){
  return "₦" + Number(amount || 0).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function showStatus(message,type="info"){
  const status = document.getElementById("status");

  status.className = "status " + type;
  status.textContent = message;
}


/* =========================================================
   CLEAR STATUS
   ========================================================= */

function clearStatus(){
  const status = document.getElementById("status");

  status.className = "status";
  status.textContent = "";
}


/* =========================================================
   QUICK AMOUNT
   ========================================================= */

function selectAmount(amount,button){

  document.getElementById("amount").value = amount;

  document
    .querySelectorAll(".quick-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  clearStatus();
}


/* =========================================================
   LOAD USER
   ========================================================= */

async function loadUser(){

  const {
    data:{
      user
    },
    error
  } = await supabaseClient.auth.getUser();

  if(error || !user){

    window.location.href = "login.html";

    return null;
  }

  currentUser = user;

  return user;
}


/* =========================================================
   LOAD WALLET BALANCE
   ========================================================= */

async function loadBalance(){

  try{

    const {
      data,
      error
    } = await supabaseClient.rpc("ensure_my_wallet");

    if(error){
      throw error;
    }

    let balance = 0;

    if(Array.isArray(data)){

      if(data.length > 0){

        balance =
          Number(
            data[0]?.balance ??
            data[0]?.wallet_balance ??
            0
          );

      }

    }else if(data){

      balance =
        Number(
          data.balance ??
          data.wallet_balance ??
          data ??
          0
        );

    }

    oldBalance = balance;

    document.getElementById("balance").textContent =
      formatMoney(balance);

    return balance;

  }catch(error){

    console.error("Wallet balance error:",error);

    showStatus(
      "Unable to load wallet balance.",
      "error"
    );

    return null;
  }
}


/* =========================================================
   FUND WALLET
   ========================================================= */

async function fundWallet(){

  if(!currentUser){

    showStatus(
      "Please log in again.",
      "error"
    );

    return;
  }

  const amountInput =
    document.getElementById("amount");

  const payBtn =
    document.getElementById("payBtn");

  const amount =
    Number(amountInput.value);

  if(!Number.isFinite(amount) || amount <= 0){

    showStatus(
      "Please enter a valid amount.",
      "error"
    );

    return;
  }

  if(amount < 100){

    showStatus(
      "Minimum funding amount is ₦100.",
      "error"
    );

    return;
  }

  payBtn.disabled = true;
  payBtn.textContent = "Opening payment...";

  clearStatus();

  try{

    const handler =
      PaystackPop.setup({

        key: PAYSTACK_PUBLIC_KEY,

        email: currentUser.email,

        amount: Math.round(amount * 100),

        currency: "NGN",

        metadata:{
          user_id: currentUser.id,
          purpose: "wallet_funding"
        },

        callback:function(response){

          showStatus(
            "Payment successful. Updating your wallet...",
            "info"
          );

          payBtn.textContent =
            "Updating wallet...";

          pollBalance(amount);
        },

        onClose:function(){

          payBtn.disabled = false;
          payBtn.textContent =
            "Fund Wallet";

          showStatus(
            "Payment window closed.",
            "error"
          );
        }

      });

    handler.openIframe();

  }catch(error){

    console.error(error);

    payBtn.disabled = false;
    payBtn.textContent =
      "Fund Wallet";

    showStatus(
      error?.message ||
      "Unable to start payment.",
      "error"
    );
  }
}


/* =========================================================
   POLL BALANCE AFTER PAYMENT
   ========================================================= */

async function pollBalance(amount){

  const payBtn =
    document.getElementById("payBtn");

  let attempts = 0;

  const maxAttempts = 10;

  const interval =
    setInterval(async()=>{

      attempts++;

      try{

        const {
          data,
          error
        } = await supabaseClient.rpc(
          "ensure_my_wallet"
        );

        if(error){
          throw error;
        }

        let newBalance = 0;

        if(Array.isArray(data)){

          if(data.length > 0){

            newBalance =
              Number(
                data[0]?.balance ??
                data[0]?.wallet_balance ??
                0
              );

          }

        }else if(data){

          newBalance =
            Number(
              data.balance ??
              data.wallet_balance ??
              data ??
              0
            );

        }

        document.getElementById("balance").textContent =
          formatMoney(newBalance);

        if(newBalance > oldBalance){

          clearInterval(interval);

          oldBalance = newBalance;

          payBtn.disabled = false;
          payBtn.textContent =
            "Fund Wallet";

          showStatus(
            "Wallet funded successfully!",
            "success"
          );

          amountInputReset();

          return;
        }

      }catch(error){

        console.error(
          "Balance polling error:",
          error
        );
      }

      if(attempts >= maxAttempts){

        clearInterval(interval);

        payBtn.disabled = false;
        payBtn.textContent =
          "Fund Wallet";

        showStatus(
          "Payment was successful, but your wallet is still updating. Please refresh in a moment.",
          "info"
        );
      }

    },3000);
}


/* =========================================================
   RESET AMOUNT
   ========================================================= */

function amountInputReset(){

  document.getElementById("amount").value = "";

  document
    .querySelectorAll(".quick-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });
}


/* =========================================================
   INITIALIZE
   ========================================================= */

async function init(){

  const user =
    await loadUser();

  if(!user){
    return;
  }

  await loadBalance();
}


/* =========================================================
   START
   ========================================================= */

init();

</script>

</body>
</html>
