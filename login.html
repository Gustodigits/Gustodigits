<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - Gustodigits</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

:root{
    --blue:#1683d8;
    --blue-dark:#075b9d;
    --blue-deep:#06365c;
    --blue-light:#38a8f5;
    --blue-soft:#e5f4ff;
    --blue-pale:#f2f9ff;

    --white:#ffffff;
    --text:#102638;
    --muted:#70818f;
    --border:#d9e8f2;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #f8fcff 0%,
            #eef8ff 55%,
            #e3f3ff 100%
        );

    color:var(--text);

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:100vh;

    padding:25px 15px;

    position:relative;

    overflow-x:hidden;

}


/* BACKGROUND */

body::before{

    content:"";

    position:fixed;

    width:370px;

    height:370px;

    top:-180px;

    right:-130px;

    border-radius:50%;

    background:
        rgba(22,131,216,.12);

    filter:blur(10px);

    pointer-events:none;

    z-index:-1;

}

body::after{

    content:"";

    position:fixed;

    width:320px;

    height:320px;

    bottom:-170px;

    left:-130px;

    border-radius:50%;

    background:
        rgba(56,168,245,.10);

    filter:blur(15px);

    pointer-events:none;

    z-index:-1;

}


/* MAIN CONTAINER */

.login-wrapper{

    width:100%;

    max-width:430px;

}


/* LOGO */

.logo{

    text-align:center;

    margin-bottom:30px;

    line-height:1;

}

.logo .gustodigits{

    display:block;

    color:var(--blue-deep);

    font-size:34px;

    font-weight:900;

    letter-spacing:-1.5px;

}

.logo .virtual{

    display:block;

    color:var(--blue);

    font-size:14px;

    font-weight:800;

    letter-spacing:3px;

    margin-top:8px;

}


/* CARD */

.login-card{

    width:100%;

    background:
        rgba(255,255,255,.94);

    border:1px solid rgba(22,131,216,.12);

    border-radius:20px;

    padding:32px 25px 28px;

    box-shadow:
        0 20px 60px rgba(20,83,122,.10),
        0 0 35px rgba(22,131,216,.04);

    backdrop-filter:blur(8px);

}


/* HEADER */

.login-header{

    text-align:center;

    margin-bottom:28px;

}

.login-header h1{

    font-size:28px;

    font-weight:800;

    color:#082b48;

    margin-bottom:9px;

}

.login-header p{

    color:#71818d;

    font-size:14px;

    line-height:1.5;

}


/* FORM */

.form-group{

    margin-bottom:19px;

}

.form-group label{

    display:block;

    color:#18384e;

    font-size:13px;

    font-weight:700;

    margin-bottom:8px;

}

.input-wrapper{

    position:relative;

}

.form-group input{

    width:100%;

    height:52px;

    border:1px solid var(--border);

    border-radius:11px;

    background:#fbfdff;

    color:#15364c;

    outline:none;

    padding:0 15px;

    font-size:15px;

    transition:.2s ease;

}

.form-group input:focus{

    border-color:var(--blue-light);

    background:#ffffff;

    box-shadow:
        0 0 0 3px rgba(56,168,245,.10);

}

.form-group input::placeholder{

    color:#9aaab6;

}


/* PASSWORD */

.password-input{

    padding-right:52px !important;

}

.toggle-password{

    position:absolute;

    right:0;

    top:0;

    width:50px;

    height:52px;

    border:0;

    background:transparent;

    color:#81919d;

    cursor:pointer;

    font-size:17px;

}

.toggle-password:hover{

    color:var(--blue);

}


/* FORGOT PASSWORD */

.forgot-row{

    display:flex;

    justify-content:flex-end;

    margin-top:-7px;

    margin-bottom:22px;

}

.forgot-row a{

    color:var(--blue);

    text-decoration:none;

    font-size:13px;

    font-weight:700;

}

.forgot-row a:hover{

    text-decoration:underline;

}


/* LOGIN BUTTON */

.login-btn{

    width:100%;

    height:53px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    color:#ffffff;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    transition:.2s ease;

    box-shadow:
        0 8px 22px rgba(22,131,216,.18);

}

.login-btn:hover{

    transform:translateY(-1px);

    box-shadow:
        0 10px 27px rgba(22,131,216,.24);

}

.login-btn:active{

    transform:translateY(0);

}

.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* MESSAGE */

.message{

    display:none;

    margin-top:16px;

    padding:12px 13px;

    border-radius:9px;

    font-size:13px;

    line-height:1.45;

    text-align:center;

}

.message.error{

    display:block;

    background:rgba(255,70,70,.07);

    border:1px solid rgba(255,70,70,.20);

    color:#d94b4b;

}

.message.success{

    display:block;

    background:rgba(22,131,216,.07);

    border:1px solid rgba(22,131,216,.18);

    color:var(--blue-dark);

}


/* DIVIDER */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:25px 0;

    color:#82919c;

    font-size:12px;

}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:#dce8ef;

}


/* REGISTER */

.register-text{

    text-align:center;

    color:#788894;

    font-size:14px;

}

.register-text a{

    color:var(--blue);

    text-decoration:none;

    font-weight:800;

}

.register-text a:hover{

    text-decoration:underline;

}


/* BACK HOME */

.back-home{

    text-align:center;

    margin-top:23px;

}

.back-home a{

    color:#7b8b96;

    text-decoration:none;

    font-size:13px;

    transition:.2s ease;

}

.back-home a:hover{

    color:var(--blue);

}


/* FOOTER */

.footer{

    text-align:center;

    margin-top:25px;

    color:#84939e;

    font-size:11px;

}


/* MOBILE */

@media(max-width:480px){

    body{

        padding:18px 13px;

    }

    .login-card{

        padding:28px 20px 25px;

        border-radius:17px;

    }

    .logo{

        margin-bottom:25px;

    }

    .logo .gustodigits{

        font-size:31px;

    }

    .login-header h1{

        font-size:25px;

    }

}

</style>

</head>

<body>

<div class="login-wrapper">


    <!-- LOGO -->

    <div class="logo">

        <span class="gustodigits">
            Gustodigits
        </span>

        <span class="virtual">
            VIRTUAL NUMBERS
        </span>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">


        <div class="login-header">

            <h1>
                Welcome back 👋
            </h1>

            <p>
                Sign in to your Gustodigits account
            </p>

        </div>


        <form
            id="loginForm"
            onsubmit="loginUser(event)"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        onclick="togglePassword()"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-row">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Continue
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


        </form>


        <!-- DIVIDER -->

        <div class="divider">
            or
        </div>


        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


    </div>


    <!-- BACK HOME -->

    <div class="back-home">

        <a href="index.html">
            ← Back to Home
        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 Gustodigits. All rights reserved.

    </div>


</div>


<script>


/* ================================
   SUPABASE CONFIGURATION
================================ */

const SUPABASE_URL =
    "https://gvuaxtsdpmrragkkjowv.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_oDAsADaZzLDiFX0cXogUyw_tTQYCa2k";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================================
   MESSAGE
================================ */

function showMessage(message, type){

    const messageBox =
        document.getElementById("message");

    messageBox.textContent =
        message;

    messageBox.className =
        "message " + type;

}


/* ================================
   PASSWORD TOGGLE
================================ */

function togglePassword(){

    const password =
        document.getElementById("password");

    const toggle =
        document.getElementById("togglePassword");


    if(!password || !toggle){
        return;
    }


    if(password.type === "password"){

        password.type = "text";

        toggle.textContent = "🙈";

        toggle.setAttribute(
            "aria-label",
            "Hide password"
        );

    }else{

        password.type = "password";

        toggle.textContent = "👁";

        toggle.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


/* ================================
   LOGIN
================================ */

async function loginUser(event){

    event.preventDefault();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    /* Clear previous message */

    document
        .getElementById("message")
        .className =
        "message";


    /* Validate */

    if(!email){

        showMessage(
            "Please enter your email address.",
            "error"
        );

        return;

    }


    if(!password){

        showMessage(
            "Please enter your password.",
            "error"
        );

        return;

    }


    /* Disable button */

    loginButton.disabled = true;

    loginButton.textContent =
        "Signing In...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            console.error(
                "Login error:",
                error
            );


            let errorMessage =
                error.message ||
                "Unable to sign in. Please try again.";


            /*
             * Make common Supabase errors
             * easier for customers to understand.
             */

            if(
                error.message &&
                error.message
                    .toLowerCase()
                    .includes(
                        "invalid login credentials"
                    )
            ){

                errorMessage =
                    "Incorrect email or password. Please check your details and try again.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Continue";

            return;

        }


        /* Successful login */

        if(
            data &&
            data.session
        ){

            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },500);


        }else{

            showMessage(
                "Login completed, but no active session was found. Please try again.",
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Continue";

        }


    }catch(error){

        console.error(
            "Unexpected login error:",
            error
        );


        showMessage(
            "Something went wrong. Please check your internet connection and try again.",
            "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
            "Continue";

    }

}


/* ================================
   ENTER KEY / FORM
================================ */

document
    .getElementById("email")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                document
                    .getElementById("password")
                    .focus();

            }

        }
    );

</script>

</body>
</html>
