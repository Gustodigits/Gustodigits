<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions - Gustodigits</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--blue:#1877f2;--blue-dark:#0f5fc4;--blue-soft:#eef6ff;--green:#16a34a;--red:#dc2626;--text:#172033;--muted:#718096;--border:#e5edf7;--white:#fff}
body{margin:0;background:#f4f8fd;color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:15px 16px;display:flex;align-items:center;gap:12px}
.header-back{width:40px;height:40px;border:0;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:22px;cursor:pointer}
header h1{margin:0;font-size:20px;font-weight:800;flex:1}
.header-refresh{width:40px;height:40px;border:0;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:18px;cursor:pointer}
main{max-width:620px;margin:auto;padding:18px 15px 95px}
.balance-card{background:linear-gradient(135deg,#1877f2,#0f5fc4);color:#fff;border-radius:20px;padding:21px 20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(24,119,242,.18)}
.balance-label{margin:0 0 7px;font-size:13px;opacity:.86;font-weight:600}
#walletBalance{margin:0;font-size:30px;font-weight:800;letter-spacing:.2px}
.balance-sub{margin:8px 0 0;font-size:12px;opacity:.82}
.section-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(25,60,100,.05)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.section-title h2{margin:0;font-size:17px}
.refresh-btn{border:0;background:var(--blue-soft);color:var(--blue);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
#transactions{display:flex;flex-direction:column;gap:11px}
.transaction{border:1px solid var(--border);border-radius:15px;padding:14px;background:#fff}
.transaction-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.transaction-type{font-size:15px;font-weight:800;color:var(--text);line-height:1.35}
.amount{font-size:16px;font-weight:800;white-space:nowrap}
.positive{color:var(--green)}
.negative{color:var(--red)}
.status-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.status{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:11px;font-weight:800;text-transform:capitalize}
.status.completed,.status.success,.status.received{background:#ecfdf3;color:#15803d}
.status.pending{background:#fff7ed;color:#c2410c}
.status.failed,.status.cancelled,.status.refunded{background:#fef2f2;color:#b91c1c}
.description{margin-top:8px;color:#667085;font-size:13px;line-height:1.45}
.date{margin-top:8px;color:#98a2b3;font-size:12px}
.empty{text-align:center;color:#8492a6;padding:42px 12px}
.empty-icon{font-size:34px;margin-bottom:8px}
.empty strong{display:block;color:#526174;font-size:15px;margin-bottom:5px}
.error{text-align:center;color:var(--red);padding:30px 12px;font-size:14px;line-height:1.5}
.loading{text-align:center;color:#718096;padding:35px 12px}
.loading-spinner{width:25px;height:25px;border:3px solid #dbeafe;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;z-index:30}
.bottom-nav-inner{width:100%;max-width:620px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-item{border:0;background:transparent;color:#8290a3;font-size:11px;font-weight:700;cursor:pointer;padding:8px 3px}
.nav-item .icon{display:block;font-size:19px;margin-bottom:3px}
.nav-item.active{color:var(--blue)}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.balance-card{border-radius:17px}.transaction-top{gap:8px}.amount{font-size:15px}}
</style>
</head>
<body>
<header>
<button class="header-back" type="button" onclick="goDashboard()" aria-label="Back">‹</button>
<h1>Transactions</h1>
<button class="header-refresh" type="button" onclick="loadTransactions()" aria-label="Refresh">↻</button>
</header>

<main>
<section class="balance-card">
<p class="balance-label">Available Wallet Balance</p>
<p id="walletBalance">Loading...</p>
<p class="balance-sub">Your wallet activity appears below.</p>
</section>

<section class="section-card">
<div class="section-title">
<h2>Transaction History</h2>
<button class="refresh-btn" type="button" onclick="loadTransactions()">Refresh</button>
</div>
<div id="transactions">
<div class="loading"><div class="loading-spinner"></div>Loading transactions...</div>
</div>
</section>
</main>

<nav class="bottom-nav">
<div class="bottom-nav-inner">
<button class="nav-item" type="button" onclick="goDashboard()"><span class="icon">⌂</span>Dashboard</button>
<button class="nav-item" type="button" onclick="goOrders()"><span class="icon">▣</span>Orders</button>
<button class="nav-item active" type="button"><span class="icon">↕</span>Transactions</button>
<button class="nav-item" type="button" onclick="openSupport()"><span class="icon">◉</span>Support</button>
</div>
</nav>

<script>
const SUPABASE_URL="https://gvuaxtsdpmrragkkjowv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_oDAsADaZzLDiFX0cXogUyw_tTQYCa2k";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let currentUser=null;

function goDashboard(){location.href="dashboard.html"}
function goOrders(){location.href="orders.html"}
function openSupport(){
  const choice=confirm("Choose Support:\n\nOK = Telegram\nCancel = WhatsApp");
  if(choice){window.open("https://t.me/GustodigitsSupportbot","_blank")}else{window.open("https://wa.me/2347038064570?text=Hello%20Gustodigits%20Support","_blank")}
}

async function getCurrentUser(){
  const {data,error}=await supabaseClient.auth.getUser();
  if(error||!data?.user){location.href="login.html";return null}
  currentUser=data.user;
  return currentUser;
}

async function loadWalletBalance(){
  const {data,error}=await supabaseClient.rpc("ensure_my_wallet");
  if(error){
    console.error("Balance error:",error);
    document.getElementById("walletBalance").textContent="Unable to load balance";
    return;
  }
  const balance=Number(data?.balance||0);
  document.getElementById("walletBalance").textContent="₦"+balance.toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function isCredit(transaction){
  const type=String(transaction?.type||"").toLowerCase().trim();
  const description=String(transaction?.description||"").toLowerCase().trim();
  return type.includes("fund")||type.includes("deposit")||type.includes("credit")||type.includes("topup")||type.includes("top up")||type.includes("wallet_funding")||type.includes("wallet funding")||type.includes("funding")||type.includes("refund")||type.includes("wallet_refund")||type.includes("wallet refund")||description.includes("wallet funding")||description.includes("fund wallet")||description.includes("wallet funded")||description.includes("wallet top up")||description.includes("wallet topup")||description.includes("deposit")||description.includes("top up")||description.includes("topup")||description.includes("funded wallet")||description.includes("refund");
}

function formatStatus(value){
  const text=String(value||"completed").trim();
  return text||"completed";
}

function statusClass(value){
  const status=String(value||"completed").toLowerCase().trim();
  if(status.includes("cancel"))return "cancelled";
  if(status.includes("refund"))return "refunded";
  if(status.includes("fail"))return "failed";
  if(status.includes("pend"))return "pending";
  if(status.includes("success")||status.includes("complete")||status.includes("received"))return "completed";
  return "";
}

async function loadTransactions(){
  const container=document.getElementById("transactions");
  container.innerHTML='<div class="loading"><div class="loading-spinner"></div>Loading transactions...</div>';

  const user=await getCurrentUser();
  if(!user)return;

  await loadWalletBalance();

  const {data,error}=await supabaseClient.from("transactions").select("id,user_id,type,amount,status,description,created_at").eq("user_id",user.id).order("created_at",{ascending:false});

  if(error){
    console.error("Transaction error:",error);
    container.innerHTML='<div class="error">Unable to load transactions.<br><br>'+escapeHTML(error.message||"Please try again.")+'</div>';
    return;
  }

  if(!Array.isArray(data)||data.length===0){
    container.innerHTML='<div class="empty"><div class="empty-icon">↕</div><strong>No transactions yet</strong><span>Your wallet activity will appear here.</span></div>';
    return;
  }

  container.innerHTML="";

  data.forEach(transaction=>{
    const amount=Math.abs(Number(transaction.amount||0));
    const credit=isCredit(transaction);
    const amountClass=credit?"positive":"negative";
    const amountSign=credit?"+":"−";
    const date=transaction.created_at?new Date(transaction.created_at).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"}):"";
    const status=formatStatus(transaction.status);
    const item=document.createElement("div");
    item.className="transaction";
    item.innerHTML=`
      <div class="transaction-top">
        <div class="transaction-type">${escapeHTML(transaction.type||"Transaction")}</div>
        <div class="amount ${amountClass}">${amountSign}₦${amount.toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
      </div>
      <div class="status-row"><span class="status ${statusClass(status)}">${escapeHTML(status)}</span></div>
      ${transaction.description?`<div class="description">${escapeHTML(transaction.description)}</div>`:""}
      ${date?`<div class="date">${escapeHTML(date)}</div>`:""}
    `;
    container.appendChild(item);
  });
}

function escapeHTML(value){
  return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

loadTransactions();
</script>
</body>
</html>
